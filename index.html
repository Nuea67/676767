<style>
:root{--bg:#000000;--panel:#0c0c10;--panel2:#131318;--line:#232329;--line2:#2c2c34;--tx:#f2f3f7;--mut:#8b8d98;--accent:#5865F2;--accentD:#4650c9;--red:#ff5470;--ok:#3ddc84;--bounce:cubic-bezier(.34,1.2,.64,1)}

button,input,select,textarea{font:inherit;color:inherit}

nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;width:100%;background:#000000f0;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 28px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;cursor:pointer;margin-right:18px;font-size:15px}

nav>a{color:var(--mut);cursor:pointer;padding:8px 14px;border-radius:10px;font-size:14px;white-space:nowrap;border:1px solid transparent;transition:color .2s,border-color .2s,background .2s;user-select:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
nav>a:hover{color:#fff}
nav>a.on{color:#fff;border-color:var(--line2);background:var(--panel)}

.btn.dcb{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#5865F2;color:#fff;text-decoration:none;margin-top:18px;box-shadow:none}
.me{display:flex;align-items:center;gap:12px;margin-left:auto;padding-left:16px;position:relative}
.me small{display:block;font-size:10px;color:var(--mut);line-height:1.2;text-align:right}.me b{color:var(--tx);font-size:14px;font-weight:600}

.dd{position:absolute;right:0;top:50px;width:230px;background:#0a0a0d;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 20px 50px #000c;animation:pop .22s var(--bounce);z-index:30}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:44px 24px 60px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}

.cat{animation:rise .45s var(--bounce) both;animation-delay:calc(var(--i,0)*70ms);cursor:pointer}
.ban{aspect-ratio:3.6/1;border-radius:14px;overflow:hidden;position:relative;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:52px;font-weight:800;color:#ffffff14;transition:border-color .2s}

.cap{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 0;font-weight:600;letter-spacing:.2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;animation:rise .4s var(--bounce) both;animation-delay:calc(var(--i,0)*50ms);transition:transform .25s,border-color .2s}

.pim{aspect-ratio:16/9;background:var(--panel2);display:grid;place-items:center;font-size:40px;font-weight:800;color:#ffffff14;overflow:hidden}.pim img{width:100%;height:100%;object-fit:cover}

.btn{background:var(--accent);border:0;border-radius:10px;padding:9px 20px;cursor:pointer;font-weight:600;box-shadow:none;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.96)}

.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.pill{padding:6px 16px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--mut);background:var(--panel);transition:border-color .2s,color .2s}

.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:460px;animation:pop .3s var(--bounce);box-shadow:0 20px 60px #0009}
input,select,textarea{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 14px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--line2)}
.search{max-width:none;margin:0 0 20px;padding-left:16px}
label{font-size:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .box{width:100%}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}td,th{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:400;font-size:13px}tr{animation:rise .3s var(--bounce) both}
.tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px;align-items:start}@media(max-width:800px){.two{grid-template-columns:1fr}}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:760px;margin:0 auto}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s}
.pc:hover{border-color:var(--line2)}.pc.on{border-color:var(--tx)}
.pc .ic{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:26px;background:var(--panel2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#111114;border:1px solid var(--line2);padding:11px 24px;border-radius:14px;z-index:99;animation:pop .25s var(--bounce)}.toast.e{border-color:var(--red)}
.warn{background:#2a2108;border:1px solid #6b5518;color:#ffd27a;padding:10px 16px;border-radius:12px;margin-bottom:18px;font-size:14px}
.okb{background:#08231a;border:1px solid #1c6b4a;color:var(--ok);padding:10px 16px;border-radius:12px;margin-bottom:18px;font-size:14px}
.thumb{width:60px;height:38px;object-fit:cover;border-radius:8px;vertical-align:middle}
pre{white-space:pre-wrap;word-break:break-all;color:var(--ok);font:13px monospace}
footer{border-top:1px solid var(--line);padding:22px 24px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}.sw u{width:44px;height:24px;border-radius:99px;background:var(--panel2);position:relative;transition:background .2s;text-decoration:none;border:1px solid var(--line)}
.sw u:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .25s,background .2s}
.sw.on u{background:var(--accent);border-color:var(--accent)}.sw.on u:after{transform:translateX(20px);background:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

/* ===== หน้า ===== */
let menu=false;

 const L=[['home','หน้าหลัก'],['products','สินค้าทั้งหมด'],['topup','เติมเงิน'],['orders','คำสั่งซื้อ']];
 const u=me&&!isAdmin()?db.users[me]:null;
 $('#nav').innerHTML=`<div class="logo" onclick="go('home','all')"><i>67</i><span>HUB</span></div>`+L.map(([k,t])=>`<a class="${view===k?'on':''}" onclick="go('${k}','all')">${t}</a>`).join('')
 +`<a class="dc" href="https://discord.gg/9GjQhNW3D3" target="_blank" rel="noopener noreferrer" title="ติดต่อแอดมิน"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.07.07 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg><span>ติดต่อแอดมิน</span></a>`

 $('#sw').className='sw'+(snd?' on':'')}

 a.innerHTML=`<div class="head"><div><div class="eb">CATEGORIES</div><h1>หมวดหมู่<span>สินค้า</span></h1></div><div class="all" onclick="go('products','all')"><i>67</i><span>ทุกหมวดหมู่ ↗</span></div></div><div class="grid">`+

 $('#pl').innerHTML=l.map((p,i)=>`<div class="card" style="--i:${i}" onclick="openProduct(${p.id})"><div class="pim">${p.img?`<img src="${p.img}">`:ini(p.name)}</div><div class="b"><span class="tag">${catName(p.cat)}</span><b style="font-size:17px">${esc(p.name)}</b><span class="mut">${esc(p.desc)}</span><span class="mut">คงเหลือ ${p.stock.length} ชิ้น</span><div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px"><span class="price">฿${(+p.price).toFixed(2)}</span><button class="btn" ${p.stock.length?'':'disabled'} onclick="event.stopPropagation();buyConfirm(${p.id},1)">${p.stock.length?'ซื้อเลย':'สินค้าหมด'}</button></div></div></div>`).join('')||'<p class="mut">ไม่พบสินค้า</p>'}
const POLICY=`สินค้าทุกชิ้นเป็นสินค้าดิจิทัล จัดส่งทันทีหลังชำระเงินสำเร็จ จึงไม่สามารถคืนเงินได้ทุกกรณี ไม่ว่าจะใช้งานแล้วหรือยังไม่ได้ใช้งานก็ตาม

async function doBuy(id,qty){
 qty=Math.max(1,qty|0);if(!me||isAdmin())return loginBox();
 let res='';
 const ok=await tx(()=>{const p=db.prods.find(x=>x.id===id),u=db.users[me];
  if(!p||p.stock.length<qty){res='สินค้าไม่พอ';return false}
  const total=p.price*qty;
  if(!u||u.bal<total){res='ยอดเงินไม่พอ กรุณาเติมเงิน';return false}
  u.bal-=total;for(let i=0;i<qty;i++)db.orders.unshift({id:uid(),user:me,name:p.name,price:p.price,item:p.stock.shift(),date:new Date().toLocaleString('th-TH')})});
 if(ok){closeM();toast('สั่งซื้อสำเร็จ 🎉');go('orders')}else if(res){closeM();toast(res,1);if(res.includes('เติมเงิน'))go('topup');else render()}}

function loginBox(reg){
 $('#ov').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="box"><h2 style="margin-bottom:18px;font-size:26px">${reg?'สมัครสมาชิก':'เข้าสู่ระบบ'}</h2><label>ชื่อผู้ใช้</label><input id="lu" autocomplete="off"><label>รหัสผ่าน</label><input id="lp" type="password" ${reg?'':`onkeydown="if(event.key==='Enter')doLogin()"`}>${reg?`<label>ยืนยันรหัสผ่าน</label><input id="lp2" type="password" onkeydown="if(event.key==='Enter')doReg()">`:''}<button class="btn" style="width:100%" onclick="${reg?'doReg()':'doLogin()'}">${reg?'สมัครสมาชิก':'เข้าสู่ระบบ'}</button><p class="mut" style="margin-top:14px;text-align:center;cursor:pointer" onclick="loginBox(${!reg})">${reg?'มีบัญชีแล้ว? เข้าสู่ระบบ':'ยังไม่มีบัญชี? สมัครสมาชิก'}</p></div></div>`;setTimeout(()=>$('#lu')?.focus(),50)}
const closeM=()=>$('#ov').innerHTML='';
async function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value;
 if(u===ADMIN.u&&p===ADMIN.p){me='@admin';await push();closeM();toast('ยินดีต้อนรับแอดมิน');return go('admin')}
 await load();if(db.users[u]&&db.users[u].pw===p){if(db.users[u].banned)return toast('บัญชีนี้ถูกระงับการใช้งาน',1);me=u;await push();closeM();toast('เข้าสู่ระบบสำเร็จ');go('home')}else toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',1)}
async function doReg(){const u=$('#lu').value.trim(),p=$('#lp').value,p2=$('#lp2').value;
 if(u.length<3||p.length<4)return toast('ชื่ออย่างน้อย 3 ตัว รหัสผ่านอย่างน้อย 4 ตัว',1);
 if(p!==p2)return toast('รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน',1);
 let dup=false;const ok=await tx(()=>{if(db.users[u]||u===ADMIN.u||u==='__proto__'){dup=true;return false}db.users[u]={pw:p,bal:0}});
 if(dup)return toast('ชื่อนี้ถูกใช้แล้ว',1);
 if(ok){me=u;await push();closeM();toast('สมัครสมาชิกสำเร็จ');go('home')}}

async function toggleBan(enc){if(!isAdmin())return;const u=decodeURIComponent(enc);await tx(()=>{if(db.users[u])db.users[u].banned=!db.users[u].banned});toast('อัปเดตสถานะแล้ว');render()}
async function giveMoney(b){
 if(!isAdmin())return;
 const u=$('#gu').value,v=+$('#ga').value;
 if(!u)return toast('กรุณาเลือกผู้เล่น',1);

 let ok=false;
 const done=await tx(()=>{if(!Object.prototype.hasOwnProperty.call(db.users,u))return false;db.users[u].bal=(+db.users[u].bal||0)+v;ok=true});

 if(done&&ok){toast(`ให้เงิน ฿${v.toFixed(2)} แก่ ${u} แล้ว`);render()}else toast('ไม่พบผู้เล่นนี้',1)}

async function addProd(b){const n=$('#pn').value.trim();if(!n||!$('#pc').value)return toast('เลือกหมวดหมู่และกรอกชื่อสินค้า',1);b.disabled=true;b.textContent='กำลังบันทึก...';
 const im=await img($('#pi').files[0],700),o={id:uid(),cat:+$('#pc').value,name:n,price:+$('#pp').value||0,desc:$('#pd').value,img:im,stock:$('#ps').value.split('\n').map(s=>s.trim()).filter(Boolean)};
 if(await tx(()=>{db.prods.push(o)})){toast('เพิ่มสินค้าแล้ว');render()}else{b.disabled=false;b.textContent='เพิ่มสินค้า'}}
async function delProd(id){if(!confirm('ลบสินค้านี้?'))return;await tx(()=>{db.prods=db.prods.filter(p=>p.id!==id)});toast('ลบแล้ว');render()}
function aStock(e){
 e.innerHTML=`<div class="two"><div class="box"><b>เพิ่มสต็อก</b><br><br><label>สินค้า</label><select id="sp">${db.prods.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock.length})</option>`).join('')}</select><label>รายการสต็อก (1 บรรทัด = 1 ชิ้น)</label><textarea id="sv" rows="5"></textarea><button class="btn" onclick="addStock()">เพิ่มสต็อก</button></div>
 <div>${db.prods.map(p=>`<div class="card" style="margin-bottom:14px"><div class="b"><b>${esc(p.name)} <span class="mut">คงเหลือ ${p.stock.length}</span></b>${p.stock.map((s,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><pre style="flex:1">${esc(s)}</pre><button class="btn d" onclick="delStock(${p.id},${i})">ลบ</button></div>`).join('')||'<span class="mut">ไม่มีสต็อก</span>'}${p.stock.length?`<button class="btn g" onclick="clearStock(${p.id})">ลบสต็อกทั้งหมด</button>`:''}</div></div>`).join('')}</div></div>`}
async function addStock(){const id=+$('#sp').value,l=$('#sv').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!id)return toast('ยังไม่มีสินค้า',1);if(!l.length)return toast('กรอกรายการสต็อก',1);if(await tx(()=>{db.prods.find(p=>p.id===id)?.stock.push(...l)})){toast(`เพิ่มสต็อก ${l.length} ชิ้น`);render()}}
async function delStock(id,i){await tx(()=>{db.prods.find(p=>p.id===id)?.stock.splice(i,1)});render()}
async function clearStock(id){if(confirm('ลบสต็อกทั้งหมดของสินค้านี้?')){await tx(()=>{const p=db.prods.find(p=>p.id===id);if(p)p.stock=[]});render()}}
